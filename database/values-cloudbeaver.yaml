# =====================================================================
# CloudBeaver — Helm values (웹 기반 DB 관리 GUI)
# Chart     : avisto/cloudbeaver (https://avistotelecom.github.io/charts/ · ArtifactHub: https://artifacthub.io/packages/helm/avisto/cloudbeaver)
# Repo      : helm repo add avisto https://avistotelecom.github.io/charts/
# Version   : chart 1.1.5 / app 26.1.0 (마지막 사용 기준)
# Namespace : database
# Install   : helm upgrade --install cloudbeaver avisto/cloudbeaver -n database --create-namespace -f values-cloudbeaver.yaml
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================

fullnameOverride: "cloudbeaver"

image:
  registry: docker.io
  repository: dbeaver/cloudbeaver
  tag: 26.1.0
  digest: ""
  pullPolicy: IfNotPresent

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 5

hostname: "beaver.techbara.dev"

ingress:
  enabled: true
  ingressClassName: "traefik"
  pathType: Prefix
  hostname: "beaver.techbara.dev"
  path: "/"

  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd, traefik-crowdsec-bouncer@kubernetescrd"
  tls: true
 
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: "longhorn"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
