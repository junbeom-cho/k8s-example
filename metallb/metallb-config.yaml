# =====================================================================
# MetalLB — L2 IP 풀 설정 (IPAddressPool + L2Advertisement)
# Chart     : metallb/metallb (https://metallb.github.io/metallb) — values 파일 없음 (차트 기본값으로 설치)
# Repo      : helm repo add metallb https://metallb.github.io/metallb
# Version   : chart 0.16.1 / app v0.16.1 (마지막 사용 기준)
# Images    : 없음 (이 파일은 CRD 리소스만 — metallb.io/v1beta1 IPAddressPool · L2Advertisement; MetalLB 이미지는 차트 기본값)
# Namespace : metallb-system
# Install   : helm upgrade --install metallb metallb/metallb -n metallb-system --create-namespace
# Apply     : kubectl apply -f metallb-config.yaml   (차트 설치 후 — MetalLB CRD/webhook 준비 필요)
# 주의      : metallb-system ns 는 Helm 릴리스와 공유됩니다. kubectl delete -f 는 Namespace 까지 지우므로
#             제거는 kubectl delete ipaddresspool/local-ip-pool l2advertisement/local-l2-adv -n metallb-system 로 하세요.
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: local-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.50.210-192.168.50.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: local-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - local-ip-pool
