# =====================================================================
# Scrutiny — Kubernetes manifest (직접 작성)
# Images    : ghcr.io/analogj/scrutiny:master-omnibus
# Namespace : scrutiny
# Apply     : kubectl apply -f scrutiny.yaml
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: scrutiny

---
# PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scrutiny
  namespace: scrutiny
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi


---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutiny
  namespace: scrutiny
  labels:
    app: scrutiny
  annotations:
    diun.enable: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scrutiny
  template:
    metadata:
      labels:
        app: scrutiny
    spec:
      containers:
        - name: scrutiny
          image: ghcr.io/analogj/scrutiny:master-omnibus
          imagePullPolicy: Always
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: COLLECTOR_SCAN_ARGS
              value: "--device /dev/nvme0 --device /dev/nvme1"
          volumeMounts:
            - name: nvme0
              mountPath: /dev/nvme0
            - name: nvme1
              mountPath: /dev/nvme1
            - name: run-udev
              mountPath: /run/udev
              readOnly: true
            - name: scrutiny-storage
              mountPath: /opt/scrutiny/config
              subPath: config
            - name: scrutiny-storage
              mountPath: /opt/scrutiny/influxdb
              subPath: influxdb
      volumes:
        - name: nvme0
          hostPath:
            path: /dev/nvme0
        - name: nvme1
          hostPath:
            path: /dev/nvme1
        - name: run-udev
          hostPath:
            path: /run/udev
        - name: scrutiny-storage
          persistentVolumeClaim:
            claimName: scrutiny  

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: scrutiny
  namespace: scrutiny
spec:
  type: ClusterIP
  selector:
    app: scrutiny
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrutiny
  namespace: scrutiny
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: "traefik"
  tls:
    - secretName: scrutiny-tls-secret
      hosts:
        - scrutiny.techbara.dev
  rules:
    - host: scrutiny.techbara.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scrutiny
                port:
                  name: http
