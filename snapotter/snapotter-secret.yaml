# ==================================================
# Secret 템플릿 (placeholder 전용, 실제 값 금지)
# 실제 값은 snapotter-secret-sync.yaml 이 Infisical 프로젝트 "snapotter"(prod) 에서 주입한다.
#
# ⚠️ secret-sync 가 동작 중일 때 이 파일을 apply 하면 실값이 placeholder 로 덮인다
#    (다음 resync 까지 최대 60초). 최초 부트스트랩 외에는 apply 하지 말 것.
#
# ⚠️ URL 안에 들어가는 비밀번호는 URL 인코딩 필수.
#    @ : / ? # 등이 들어가면 접속이 깨진다. 영숫자로만 생성하는 편이 안전하다:
#      openssl rand -hex 32
# ==================================================
apiVersion: v1
kind: Secret
metadata:
  name: snapotter-secret
  namespace: snapotter
  labels:
    app: snapotter
type: Opaque
stringData:
  # database ns 의 공용 postgres. DB/유저는 미리 생성해 둘 것 (snapotter_db / snapotter_user)
  DATABASE_URL: "postgres://snapotter_user:your-db-password@postgres.database.svc.cluster.local:5432/snapotter_db"

  # snapotter ns 전용 Valkey (Helm 릴리스 valkey → Service valkey-client).
  # 비밀번호는 아래 VALKEY_PASSWORD 와 반드시 동일해야 한다.
  # (Valkey 는 프로토콜 호환이라 redis:// 스킴 그대로 사용)
  REDIS_URL: "redis://:your-valkey-password@valkey-client.snapotter.svc.cluster.local:6379"

  # Valkey 차트가 auth.existingSecret 으로 읽어가는 키 (values-valkey-helmforge.yaml).
  # REDIS_URL 안의 비밀번호와 같은 값이어야 한다.
  VALKEY_PASSWORD: "your-valkey-password"

  # 최초 admin 계정 비밀번호 (compose 기본값 'admin' 은 절대 사용 금지)
  DEFAULT_PASSWORD: "your-strong-admin-password"

  # 세션 쿠키 서명 키. 비워두면 재시작 때마다 세션이 무효화될 수 있다.
  COOKIE_SECRET: "your-cookie-secret"
