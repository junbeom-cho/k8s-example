# =====================================================================
# Uptime Kuma — Helm values
# Chart     : uptime-kuma/uptime-kuma (https://helm.irsigler.cloud, dirsigler/uptime-kuma-helm)
# Repo      : helm repo add uptime-kuma https://helm.irsigler.cloud
# Version   : chart 확인 필요 / app 2.3.0 (image.tag 지정값, 마지막 사용 기준)
# Namespace : uptime-kuma
# Install   : helm upgrade --install uptime-kuma uptime-kuma/uptime-kuma -n uptime-kuma --create-namespace -f values.yaml
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================

image:
  repository: louislam/uptime-kuma
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.3.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# -- A custom namespace to override the default namespace for the deployed resources.
namespaceOverride: ""

# If this option is set to false a StateFulset instead of a Deployment is used
useDeploy: true

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  diun.enable: "true"
podLabels:
  {}
  # app: uptime-kuma
podEnv: []
  # optional additional environment variables
  # - name: "A_VARIABLE"
  #   value: "a-value"

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3001
  nodePort:
  loadBalancerIP:
  annotations: {}

ingress:
  enabled: true
  className: "traefik"
  extraLabels:
    {}
    # vhost: uptime-kuma.company.corp
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: kuma.techbara.dev
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: uptime-kuma-tls-secret
      hosts:
        - kuma.techbara.dev
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbe:
  enabled: true
  failureThreshold: 3
  # Uptime-Kuma recommends to configure a delay of 180 seconds until the server fully started.
  # https://github.com/louislam/uptime-kuma/blob/ae224f9e188b1fc32ed8729818710975589cdce7/extra/healthcheck.go#L3
  initialDelaySeconds: 180
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 2
  # The NodeJS Version of this Healthcheck is no longer supported, therefore we don't specify a node command.
  # https://github.com/louislam/uptime-kuma/blob/ae224f9e188b1fc32ed8729818710975589cdce7/extra/healthcheck.js#L6
  exec:
    command:
      - "extra/healthcheck"

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1
  exec:
    command: []
  httpGet:
    path: /
    port: 3001
    scheme: HTTP
    httpHeaders: []

volume:
  enabled: true
  accessMode: ReadWriteOnce
  size: 4Gi
  # If you want to use a storage class other than the default, specify it here.
  storageClassName: "longhorn"
  # Reuse your own pre-existing PVC.
  existingClaim: ""

# -- A list of additional volumes to be added to the pod
additionalVolumes:
  []
  # - name: "additional-certificates"
  #   configMap:
  #     name: "additional-certificates"
  #     optional: true
  #     defaultMode: 420

# -- A list of additional volumeMounts to be added to the pod
additionalVolumeMounts:
  []
  # - name: "additional-certificates"
  #   mountPath: "/etc/ssl/certs/additional/additional-ca.pem"
  #   readOnly: true
  #   subPath: "additional-ca.pem"

strategy:
  type: RollingUpdate

# External MySQL/MariaDB database configuration
# Configure this section to connect to your own MySQL or MariaDB database.
# You can use any MySQL-compatible provider of your choice.
externalDatabase:
  type: "mariadb"
  enabled: false
  hostname: ""
  port: 3306
  database: uptime_kuma
  username: uptime_kuma
  password: ""
  # Use existing secret for database credentials
  existingSecret: ""
  existingSecretPasswordKey: "password"
  existingSecretUsernameKey: "username"

# Prometheus ServiceMonitor configuration
serviceMonitor:
  enabled: false
  # -- Scrape interval. If not set, the Prometheus default scrape interval is used.
  interval: 60s
  # -- Timeout if metrics can't be retrieved in given time interval
  scrapeTimeout: 10s
  # -- Scheme to use when scraping, e.g. http (default) or https.
  scheme: ~
  # -- TLS configuration to use when scraping, only applicable for scheme https.
  tlsConfig: {}
  # -- Prometheus [RelabelConfigs] to apply to samples before scraping
  relabelings: []
  # -- Prometheus [MetricRelabelConfigs] to apply to samples before ingestion
  metricRelabelings: []
  # -- Prometheus ServiceMonitor selector, only select Prometheus's with these
  # labels (if not set, select any Prometheus)
  selector: {}

  # -- Namespace where the ServiceMonitor resource should be created, default is
  # the same as the release namespace
  namespace: ~
  # -- Additional labels to add to the ServiceMonitor
  additionalLabels: {}
  # -- Additional annotations to add to the ServiceMonitor
  annotations: {}

  # -- BasicAuth credentials for scraping metrics, use API token and any string for username
  # basicAuth:
  #   username: "metrics"
  #   password: ""

# -- Use this option to set a custom DNS policy to the created deployment
dnsPolicy: ""

# -- Use this option to set custom DNS configurations to the created deployment
dnsConfig: {}

# -- Use this option to set custom PriorityClass to the created deployment
# ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/#priorityclass
priorityClassName: ""

# -- Create a NetworkPolicy
networkPolicy:
  # -- Enable/disable Network Policy
  enabled: false
  # -- Enable/disable Ingress policy type
  ingress: true
  # -- Enable/disable Egress policy type
  egress: true
  # -- Allow incoming connections only from specific Pods
  # When set to true, the geoserver will accept connections from any source.
  # When false, only Pods with the label {{ include "geoserver.fullname" . }}-client=true will have network access
  allowExternal: true
  # -- Selects particular namespaces for which all Pods are allowed as ingress sources
  namespaceSelector: {}
  #  matchLabels:
  #    role: frontend
  #  matchExpressions:
  #   - {key: role, operator: In, values: [frontend]}
