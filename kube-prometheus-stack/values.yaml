# =====================================================================
# kube-prometheus-stack — Helm values
# Chart     : kube-prometheus-stack (oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack — OCI, repo add 불필요)
# Version   : chart 86.2.3 / app v0.91.0 (prometheus-operator) (마지막 사용 기준)
# Namespace : kube-prometheus-stack
# Install   : helm upgrade --install kube-prometheus-stack oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack -n kube-prometheus-stack --create-namespace -f values.yaml
# 참고      : 같은 차트가 HTTP 저장소에도 있습니다 → helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#             (이 경우 차트 이름은 prometheus-community/kube-prometheus-stack)
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================

fullnameOverride: "grafana"


kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  admin:
    existingSecret: grafana-secret
    userKey: "ADMIN_USER"
    passwordKey: "ADMIN_PASSWORD"
  persistence:
    enabled: true
    storageClassName: longhorn
    type: pvc
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
      traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd, traefik-crowdsec-bouncer@kubernetescrd"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - grafana.techbara.dev
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls-secret
        hosts:
          - grafana.techbara.dev
    grafana.ini:
      server:
        domain: grafana.techbara.dev
        root_url: https://grafana.techbara.dev
        serve_from_sub_path: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

prometheus-node-exporter:
  service:
    port: 9101
    targetPort: 9101
