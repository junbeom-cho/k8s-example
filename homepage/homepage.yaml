# =====================================================================
# Homepage — Kubernetes manifest (직접 작성)
# Images    : ghcr.io/gethomepage/homepage:latest (태그 미고정 → 사용 시 버전 고정 권장)
# Namespace : homepage
# Apply     : kubectl apply -f homepage.yaml
# Config    : config/ 를 hostPath(/home/techbara/server-k3s/homepage/config)로 마운트
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: homepage

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
  annotations:
    diun.enable: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
      annotations:
        diun.enable: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.techbara.dev"
            - name: LOG_TARGET
              value: "stdout"
      volumes:
        - name: config-volume
          hostPath:
            path: /home/techbara/server-k3s/homepage/config
            type: Directory

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: ClusterIP
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP


---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd, traefik-crowdsec-bouncer@kubernetescrd"
spec:
  ingressClassName: "traefik"
  tls:
    - secretName: homepage-tls-secret
      hosts:
        - home.techbara.dev
  rules:
    - host: home.techbara.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
