# =====================================================================
# letsencrypt-cloudflare — cert-manager ClusterIssuer (Let's Encrypt ACME, DNS-01 / Cloudflare)
# Images    : 없음 (CRD 리소스 — cert-manager.io/v1 ClusterIssuer)
# Namespace : 없음 (클러스터 범위 리소스) — 참조 Secret: cert-manager ns 의 cert-manager-secret (key: api-token)
# Apply     : kubectl apply -f cluster-issuer.yaml   (cert-manager 차트 설치 + cert-manager-secret 준비 후)
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    email: dev.junbeom@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cert-manager-secret
            key: api-token
