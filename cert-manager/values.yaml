# =====================================================================
# cert-manager — Helm values
# Chart     : jetstack/cert-manager (https://charts.jetstack.io)
# Repo      : helm repo add jetstack https://charts.jetstack.io
# Docs      : https://artifacthub.io/packages/helm/cert-manager/cert-manager
# Version   : chart v1.20.2 / app v1.20.2 (마지막 사용 기준)
# Namespace : cert-manager
# Install   : helm upgrade --install cert-manager jetstack/cert-manager -n cert-manager --create-namespace -f values.yaml
# 다음 단계 : Secret 준비 (secret-sync.yaml.example 또는 secret.yaml.example) → kubectl apply -f cluster-issuer.yaml
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================

crds:
  enabled: true

replicaCount: 1

extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53

resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    cpu: 100m
    memory: 256Mi

webhook:
  replicaCount: 1
  timeoutSeconds: 10

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi


cainjector:
  replicaCount: 1
  
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
