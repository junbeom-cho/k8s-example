# =====================================================================
# crowdsec-bouncer — Traefik Middleware (CrowdSec bouncer forwardAuth)
# Images    : 없음 (CRD 리소스 — traefik.io/v1alpha1 Middleware)
# Namespace : traefik
# Apply     : kubectl apply -f crowdsec-forwardauth.yaml   (traefik 차트 설치 후 — Middleware CRD 필요)
# Ref       : traefik-crowdsec-bouncer@kubernetescrd (Ingress annotation traefik.ingress.kubernetes.io/router.middlewares)
# Depends   : crowdsec ns 의 crowdsec-traefik-bouncer Service
# 주의      : traefik ns 는 Helm 릴리스와 공유됩니다. kubectl delete -f 는 Namespace 까지 지우므로
#             제거는 kubectl delete middlewares.traefik.io crowdsec-bouncer -n traefik 로 하세요.
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  forwardAuth:
    address: http://crowdsec-traefik-bouncer.crowdsec.svc.cluster.local:80/api/v1/forwardAuth
    trustForwardHeader: true
