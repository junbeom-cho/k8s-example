# =====================================================================
# authentik-forwardauth — Traefik Middleware (Authentik SSO forwardAuth)
# Images    : 없음 (CRD 리소스 — traefik.io/v1alpha1 Middleware)
# Namespace : traefik
# Apply     : kubectl apply -f authentik-forwardauth.yaml   (traefik 차트 설치 후 — Middleware CRD 필요)
# Ref       : traefik-authentik-forwardauth@kubernetescrd (Ingress annotation traefik.ingress.kubernetes.io/router.middlewares)
# Depends   : authentik ns 의 authentik-server (embedded outpost)
# 주의      : traefik ns 는 Helm 릴리스와 공유됩니다. kubectl delete -f 는 Namespace 까지 지우므로
#             제거는 kubectl delete middlewares.traefik.io authentik-forwardauth -n traefik 로 하세요.
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: traefik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
