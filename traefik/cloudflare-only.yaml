# =====================================================================
# cloudflare-only — Traefik Middleware (Cloudflare IP 대역 + 내부망 192.168.0.0/16 만 허용)
# Images    : 없음 (CRD 리소스 — traefik.io/v1alpha1 Middleware)
# Namespace : traefik
# Apply     : kubectl apply -f cloudflare-only.yaml   (traefik 차트 설치 후 — Middleware CRD 필요)
# Ref       : traefik-cloudflare-only@kubernetescrd (Ingress annotation traefik.ingress.kubernetes.io/router.middlewares)
# 참고      : Cloudflare IP 대역은 https://www.cloudflare.com/ips/ 에서 최신 목록 확인
# 주의      : traefik ns 는 Helm 릴리스와 공유됩니다. kubectl delete -f 는 Namespace 까지 지우므로
#             제거는 kubectl delete middlewares.traefik.io cloudflare-only -n traefik 로 하세요.
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - "173.245.48.0/20"
      - "103.21.244.0/22"
      - "103.22.200.0/22"
      - "103.31.4.0/22"
      - "141.101.64.0/18"
      - "108.162.192.0/18"
      - "190.93.240.0/20"
      - "188.114.96.0/20"
      - "197.234.240.0/22"
      - "198.41.128.0/17"
      - "162.158.0.0/15"
      - "104.16.0.0/13"
      - "104.24.0.0/14"
      - "172.64.0.0/13"
      - "131.0.72.0/22"
      - "192.168.0.0/16"
