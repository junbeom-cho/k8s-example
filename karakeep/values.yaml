# =====================================================================
# Karakeep — Helm values
# Chart     : helmforge/karakeep (https://repo.helmforge.dev)
# Repo      : helm repo add helmforge https://repo.helmforge.dev
# Version   : chart 1.2.6 / app 0.32.0 (마지막 사용 기준)
# Namespace : karakeep
# Install   : helm upgrade --install karakeep helmforge/karakeep -n karakeep --create-namespace -f values.yaml
# Secrets   : karakeep-secret (NEXTAUTH_SECRET, MEILI_MASTER_KEY) → secret.yaml.example / secret-sync.yaml.example
#             brevo-secret (SMTP_HOST/PORT/USER/PASSWORD) → infisical/secret-sync.yaml.example 의
#             brevo-secret-sync 가 이 ns 로 주입 (ns 간 동기화)
#             ※ minio/ 의 minio-secret, infisical/ 의 resend-secret 도 이 ns 로 동기화되지만 현재 values 에서는 미사용
# 원본 주석 : Karakeep Helm Chart - Default Values
#             Focus: AI-powered bookmark manager with optional Meilisearch and Chromium sidecars
#             SPDX-License-Identifier: Apache-2.0
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================

nameOverride: ""
fullnameOverride: "karakeep"
commonLabels: {}

# =============================================================================
# Image
# =============================================================================

image:
  # -- Karakeep container image
  repository: ghcr.io/karakeep-app/karakeep
  # -- Image tag
  tag: "0.32.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# =============================================================================
# Karakeep Configuration
# =============================================================================

karakeep:
  # -- Public URL of the Karakeep instance (e.g. https://karakeep.example.com)
  nextAuthUrl: "https://karakeep.techbara.dev"
  # -- Connect to the browser service only when crawling needs it
  browserConnectOnDemand: true
  # -- Existing secret containing nextauth-secret and meili-master-key
  existingSecret: "karakeep-secret"
  # -- Key in the existing secret for NEXTAUTH_SECRET
  existingSecretNextAuthKey: NEXTAUTH_SECRET
  # -- Key in the existing secret for MEILI_MASTER_KEY
  existingSecretMeiliMasterKey: MEILI_MASTER_KEY
  # -- Extra environment variables for the main container
  # -- @default -- `[]`
  extraEnv:
    - name: DISABLE_SIGNUPS
      value: "true"
    - name: SMTP_HOST
      valueFrom:
        secretKeyRef:
          name: brevo-secret
          key: SMTP_HOST
    - name: SMTP_PORT
      valueFrom:
        secretKeyRef:
          name: brevo-secret
          key: SMTP_PORT
    - name: SMTP_USER
      valueFrom:
        secretKeyRef:
          name: brevo-secret
          key: SMTP_USER
    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: brevo-secret
          key: SMTP_PASSWORD
    - name: SMTP_FROM
      value: "Karakeep@techbara.dev"
# =============================================================================
# Meilisearch Sidecar (optional full-text search)
# =============================================================================

meilisearch:
  # -- Enable Meilisearch sidecar for full-text search
  enabled: true
  image:
    # -- Meilisearch container image
    repository: docker.io/getmeili/meilisearch
    # -- Meilisearch image tag
    tag: "v1.41.0"
    pullPolicy: IfNotPresent
  # -- Resources for the Meilisearch container
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"

# =============================================================================
# Chromium Sidecar (optional web page screenshots)
# =============================================================================

chromium:
  # -- Enable Chromium sidecar for web page screenshots
  enabled: true
  # -- Internal Chromium sidecar HTTP port
  port: 9222
  image:
    # -- Chromium container image
    repository: ghcr.io/browserless/chromium
    # -- Chromium image tag
    tag: "v2.46.0"
    pullPolicy: IfNotPresent
  # -- Resources for the Chromium container
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"

# =============================================================================
# Persistence
# =============================================================================

persistence:
  # -- Enable persistence for application data (SQLite + uploads)
  enabled: true
  # -- Storage size
  size: 10Gi
  # -- Storage class
  storageClass: "longhorn"
  # -- Access modes
  accessModes:
    - ReadWriteOnce
  # -- Use an existing PVC
  existingClaim: ""

# =============================================================================
# Service Account
# =============================================================================

serviceAccount:
  # -- Create a ServiceAccount
  create: false
  # -- ServiceAccount name
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}

# =============================================================================
# Service
# =============================================================================

service:
  # -- Service type
  type: ClusterIP
  # -- HTTP service port
  port: 80
  # -- Annotations for the Service
  annotations: {}
  # -- Service IP family policy: SingleStack | PreferDualStack | RequireDualStack. Empty uses cluster default.
  ipFamilyPolicy: ~
  # -- Service IP families override. Empty uses cluster default.
  ipFamilies: []

# =============================================================================
# Ingress
# =============================================================================

ingress:
  # -- Enable ingress for Karakeep
  enabled: true
  # -- Ingress class name (for example: traefik, nginx)
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd, traefik-crowdsec-bouncer@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # cert-manager.io/cluster-issuer: letsencrypt
  # -- Ingress hosts
  hosts:
    - host: karakeep.techbara.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - karakeep.techbara.dev
      secretName: karakeep-tls
    # - host: karakeep.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # -- Ingress TLS configuration
    # - hosts:
    #     - karakeep.example.com
    #   secretName: karakeep-tls

# =============================================================================
# Gateway API
# =============================================================================

gatewayAPI:
  # -- Enable Gateway API HTTPRoute for Karakeep HTTP (requires Gateway API CRDs)
  enabled: false
  # -- Parent Gateway references. Leave empty to attach through controller defaults.
  parentRefs: []
  #   - name: shared-gateway
  #     namespace: gateway-system
  #     sectionName: https
  # -- HTTPRoute hostnames
  hostnames: []
  #   - karakeep.example.com
  # -- HTTPRoute path matches
  paths:
    - type: PathPrefix
      value: /
  # -- HTTPRoute annotations
  annotations: {}

# =============================================================================
# Probes
# =============================================================================

probes:
  startup:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# =============================================================================
# Resources and Security
# =============================================================================

resources: {}

podSecurityContext: {}

securityContext: {}

# =============================================================================
# Scheduling
# =============================================================================

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30

podLabels: {}
podAnnotations: {}

# =============================================================================
# Extra
# =============================================================================

extraVolumes: []
extraVolumeMounts: []

# -- Extra manifests to deploy alongside the chart
extraManifests: []

# =============================================================================
# External Secrets Operator
# =============================================================================

externalSecrets:
  # -- Render ExternalSecret for the Karakeep auth/search secret.
  # Requires karakeep.existingSecret to be set to prevent credential drift
  # between the chart-managed Secret and the ExternalSecret.
  enabled: false
  # -- ExternalSecret apiVersion
  apiVersion: external-secrets.io/v1
  # -- Refresh interval
  refreshInterval: "0"
  secretStoreRef:
    # -- Existing SecretStore or ClusterSecretStore name
    name: ""
    # -- SecretStore or ClusterSecretStore
    kind: SecretStore
  target:
    # -- ExternalSecret target Secret creation policy
    creationPolicy: Owner
  # -- ExternalSecret data entries mapping remote keys to Karakeep Secret keys.
  data: []
  #   - secretKey: nextauth-secret
  #     remoteRef:
  #       key: karakeep/credentials
  #       property: nextauth-secret
  #   - secretKey: meili-master-key
  #     remoteRef:
  #       key: karakeep/credentials
  #       property: meili-master-key
  # -- ExternalSecret annotations
  annotations: {}
