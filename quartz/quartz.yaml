# =====================================================================
# Quartz 블로그 (Nginx 정적 호스팅) — Kubernetes manifest (직접 작성)
# Images    : nginx:stable-alpine
# Namespace : quartz
# Apply     : kubectl apply -f quartz.yaml
# 주의      : quartz ns 는 Helm 릴리스(Syncthing · CouchDB)와 공유됩니다. kubectl delete -f 는 Namespace 까지 지우므로
#             제거는 kubectl delete deploy/quartz svc/quartz-svc ingress/quartz-blog-ingress -n quartz 로 하세요.
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: quartz

---
# =================================================================================
# 1. Deployment : Nginx 앱 실행 (볼륨, 리소스, 헬스체크 포함)
# =================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quartz
  namespace: quartz
  labels:
    app: quartz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quartz
  template:
    metadata:
      labels:
        app: quartz
    spec:
      containers:
        - name: quartz
          image: nginx:stable-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          
          volumeMounts:
            - name: blog-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              readOnly: true
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
 
      volumes:
        - name: blog-content
          hostPath: 
            path: /home/techbara/quartz
            type: Directory
        - name: nginx-conf
          hostPath: 
            path: /home/techbara/quartz/default.conf
            type: File
 
---
# ==================================================================================
# 2. Service : 클러스터 내부 네트워크 연결 (ClusterIP)
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: quartz-svc
  namespace: quartz
spec:
  type: ClusterIP       # 클러스터 내부에서만 접근 가능한 서비스
  selector:
    app: quartz
  ports:
    - port: 80
      targetPort: 80
 
---
# ==================================================================================
# 3. Ingress : Traefik 대문 설정 (외부 도메인 연결)
# ==================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quartz-blog-ingress
  namespace: quartz
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd, traefik-crowdsec-bouncer@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.techbara.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quartz-svc
                port:
                  number: 80
  tls:
    - secretName: quartz-tls
      hosts:
        - wiki.techbara.dev
