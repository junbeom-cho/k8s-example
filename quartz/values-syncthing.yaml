# =====================================================================
# Syncthing (Obsidian vault 동기화) — Helm values
# Chart     : k8s-home-lab/syncthing (https://k8s-home-lab.github.io/helm-charts/ · ArtifactHub: https://artifacthub.io/packages/helm/k8s-home-lab-repo/syncthing)
# Repo      : helm repo add k8s-home-lab https://k8s-home-lab.github.io/helm-charts/
# Version   : chart 5.1.2 / app 2.1.0 (마지막 사용 기준; image 를 lscr.io/linuxserver/syncthing:2.1.0 으로 지정 — 차트 appVersion 은 2.0.16)
# Namespace : quartz
# Install   : helm upgrade --install syncthing k8s-home-lab/syncthing -n quartz --create-namespace -f values-syncthing.yaml
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================
image:
  repository: lscr.io/linuxserver/syncthing
  tag: "2.1.0"
  pullPolicy: IfNotPresent

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Asia/Seoul"

service:
  main:
    type: ClusterIP
    ports:
      http:
        port: 8384
  
  listen:
    enabled: true
    type: LoadBalancer
    annotations:
      metallb.universe.tf/allow-shared-ip: "syncthing-shared-ip"
    ports:
      listen: 
        enabled: true
        port: 22000
        protocol: TCP
        targetPort: 22000
      listen-udp:
        enabled: true
        port: 22000
        protocol: UDP
        targetPort: 22000
        
  discovery:
    enabled: true
    type: LoadBalancer
    annotations:
      metallb.universe.tf/allow-shared-ip: "syncthing-shared-ip"
    ports:
      discovery:
        enabled: true
        port: 21027
        protocol: UDP
        targetPort: 21027

ingress:
  main:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
      traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: sync.techbara.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: syncthing-tls-secret
        hosts:
          - sync.techbara.dev

persistence:
  config:
    enabled: true
    storageClass: "longhorn"
    accessMode: ReadWriteOnce
    size: 2Gi
    mountPath: /config

  obsidian-vault:
    enabled: true
    type: hostPath
    hostPath: /home/techbara/obsidian-vault
    mountPath: /obsidian-vault

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "1.0"
    memory: "1Gi"

probes:
  liveness:
    custom: true
    spec:
      httpGet:
        path: /rest/noauth/health
        port: 8384
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 10
      failureThreshold: 3
  readiness:
    custom: true
    spec:
      httpGet:
        path: /rest/noauth/health
        port: 8384
      initialDelaySeconds: 15
      periodSeconds: 15
