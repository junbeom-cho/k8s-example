# ===================================================================
# ConfigMap
# ===================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
  namespace: core-infra
data:
  USER_UID: "1000"
  USER_GID: "1000"
  FORGEJO__database__DB_TYPE: "postgres"
  FORGEJO__database__HOST: "postgres-svc"

---
# ===================================================================
# PersistentVolumeClaim
# ===================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-pvc
  namespace: core-infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi

---
# ===================================================================
# Deployment
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: core-infra
  labels:
    app: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:14
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          envFrom:
            - configMapRef:
                name: forgejo-config
          env:
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: DB_PASSWORD
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: DB_USER
            - name: FORGEJO__database__NAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: DB_NAME
          resources:
            requests:
              cpu: "100m"
              memory: "500Mi"
            limits:
              cpu: "1.0"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: forgejo-data
              mountPath: /data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-pvc
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File

---
# ===================================================================
# Service - HTTP
# ===================================================================
apiVersion: v1
kind: Service
metadata:
  name: forgejo-svc
  namespace: core-infra
spec:
  type: ClusterIP
  selector:
    app: forgejo
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
# ===================================================================
# Service - SSH
# ===================================================================
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh-svc
  namespace: core-infra
spec:
  type: NodePort
  selector:
    app: forgejo
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      # Linux 호스트 머신에서 접근할 포트 지정 (필요에 따라 변경 가능)
      nodePort: 30022

---
# ==================================================================================
# Ingress
# ==================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-ingress
  namespace: core-infra
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - forgejo.junbeom.work
      secretName: forgejo-tls-secret
  rules:
    - host: forgejo.junbeom.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo-svc
                port:
                  number: 80