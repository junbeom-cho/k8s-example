apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-sync
  namespace: core-infra
spec:
  hostAPI: https://infisical.junbeom.work/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infisical"
        envSlug: "prod"
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-auth-token
        secretNamespace: core-infra
  managedKubeSecretReferences:
    - secretName: infisical-secret
      secretNamespace: core-infra
      secretType: Opaque