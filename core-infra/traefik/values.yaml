# ==========================================
# Traefik v3 커스텀 설정 파일 (Helm Values)
# ==========================================

image:
  registry: docker.io
  repository: traefik
  tag: v3.7.1
  pullPolicy: IfNotPresent

providers:
  kubernetesIngress:
    publishedService:
      enabled: false
  kubernetesCRD:
    allowCrossNamespace: true

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
      middlewares:
        - core-infra-crowdsec-bouncer@kubernetescrd
    forwardedHeaders:
      trustedIPs: &cloudflareIPs
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/12
        - 172.64.0.0/13
        - 131.0.72.0/22
        # 사용자 인프라 내부망 및 Tailscale 대역 추가 (헤더 신뢰 보장)
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 100.64.0.0/10 
  websecure:
    port: 8443
    expose:
      default: true
    http:
      middlewares:
        - core-infra-crowdsec-bouncer@kubernetescrd
    exposedPort: 443
    forwardedHeaders:
      trustedIPs: *cloudflareIPs

deployment:
  kind: DaemonSet
  dnsPolicy: ClusterFirstWithHostNet
  annotations:
    diun.enable: "true"
  podAnnotations:
    diun.enable: "true"


updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

ingressRoute:
  dashboard:
    enabled: false

hostNetwork: true

logs:
  access:
    enabled: true

experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.6.0"