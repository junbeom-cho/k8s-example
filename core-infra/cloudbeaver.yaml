# ==================================================================================
# 1. ConfigMap : 환경 변수
# ==================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbeaver-config
  namespace: core-infra
data:
  TZ: "Asia/Seoul"

---
# ==================================================================================
# 2. PersistentVolumeClaim : 워크스페이스 데이터 영구 저장
# ==================================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver-pvc
  namespace: core-infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
# ==================================================================================
# 3. Service : 내부 네트워크
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver-svc
  namespace: core-infra
spec:
  type: ClusterIP
  selector:
    app: cloudbeaver
  ports:
    - name: http
      port: 80
      targetPort: 8978

---
# ==================================================================================
# 4. Deployment : CloudBeaver 애플리케이션
# ==================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: core-infra
  labels:
    app: cloudbeaver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:latest
          ports:
            - containerPort: 8978
          envFrom:
            - configMapRef:
                name: cloudbeaver-config
          
          # ==========================================
          # 헬스체크 (Docker Compose의 curl 방식을 K8s native httpGet으로 변환)
          # ==========================================
          livenessProbe:
            httpGet:
              path: /status
              port: 8978
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: 8978
            initialDelaySeconds: 5
            periodSeconds: 10
            
          # ==========================================
          # 리소스 제한 (기존 설정 100% 반영)
          # ==========================================
          resources:
            requests:
              cpu: "100m"
              memory: "400Mi"
            limits:
              cpu: "1.0"
              memory: "1Gi"
              
          volumeMounts:
            - name: cloudbeaver-data
              mountPath: /opt/cloudbeaver/workspace
              
      volumes:
        - name: cloudbeaver-data
          persistentVolumeClaim:
            claimName: cloudbeaver-pvc

---
# ==================================================================================
# 6. Ingress : Traefik 대문 및 SSL 자동화
# ==================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbeaver-ingress
  namespace: core-infra
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "core-infra-cloudflare-only@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - beaver.junbeom.work    # 사용할 서브도메인 (필요시 cloudbeaver.junbeom.work 등으로 수정)
      secretName: cloudbeaver-tls-secret
  rules:
    - host: beaver.junbeom.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudbeaver-svc
                port:
                  number: 80