# ==============================================================================
# Shlink Web Helm Chart Values
# https://artifacthub.io/packages/helm/christianhuth/shlink-web
# ==============================================================================

image:
  registry: docker.io
  repository: shlinkio/shlink-web-client
  pullPolicy: IfNotPresent
  tag: "4.7.0"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-cloudflare-only@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: shlink.junbeom.work
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: shlink-web-tls-secret
      hosts:
        - shlink.junbeom.work

extraEnv:
  - name: TZ
    value: "Asia/Seoul"
  - name: MULTI_SEGMENT_SLUGS_ENABLED
    value: "true"
  - name: DEFAULT_DOMAIN
    value: "link.junbeom.work"
  - name: IS_HTTPS_ENABLED
    value: "true"
  - name: SHLINK_SERVER_API_KEY
    valueFrom:
      secretKeyRef:
        name: shlink-secret
        key: shlink-server-api-key