---
# =================================================================================
# 1. PersistentVolumeClaim (PVC) : 영구 데이터 저장소
# 기존의 바인드 마운트 대체
# =================================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: core-infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi

---
# ==================================================================================
# 2. Service : 네트워크 연결
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: core-infra
spec:
  type: ClusterIP
  selector:
    app: postgresql
  ports:
    - protocol: TCP
      name: postgres
      port: 5432
      targetPort: 5432

---
# ====================================================================================
# 3. StatefulSet : 애플리케이션 실행
# ====================================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: core-infra
  labels:
    app: postgresql
spec:
  serviceName: "postgres-svc"
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        dev.quenary.tugtainer.protected: "true"
    spec:
      containers:
        - name: postgresql
          image: postgres:17
          args:
            - "postgres"
            - "-c"
            - "shared_buffers=256MB"
            - "-c"
            - "effective_cache_size=1GB"
            - "-c"
            - "maintenance_work_mem=128MB"
            - "-c"
            - "checkpoint_completion_target=0.9"
            - "-c"
            - "wal_buffers=16MB"
            - "-c"
            - "default_statistics_target=100"
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            - "-c"
            - "work_mem=4MB"
            - "-c"
            - "min_wal_size=1GB"
            - "-c"
            - "max_wal_size=4GB"
            - "-c"
            - "max_worker_processes=4"
            - "-c"
            - "max_parallel_workers_per_gather=2"
            - "-c"
            - "max_parallel_workers=4"
            - "-c"
            - "max_parallel_maintenance_workers=2"

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: "Asia/Seoul"
            - name: LANG
              value: "en_US.utf8"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"

          ports:
            - containerPort: 5432

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5

          resources:
            limits:
              cpu: "2.0"
              memory: "2Gi"
            requests:
              cpu: "1.0"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
