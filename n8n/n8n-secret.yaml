# ==================================================
# Secret: 데이터베이스 보안 정보
# ==================================================
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: apps
type: Opaque
stringData:
  DATABASE_PASSWORD: 'your-database-password'
  ENCRYPTION_KEY: 'your-encryption-key'
  AUTH_TOKEN: 'your-auth-token'