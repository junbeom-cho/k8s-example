apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: umami-secret-sync
  namespace: umami
spec:
  hostAPI: https://infisical.techbara.dev/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "umami"
        envSlug: "prod"
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-auth-token
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: umami-secret
      secretNamespace: umami
      secretType: Opaque
