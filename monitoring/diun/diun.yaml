apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: monitoring
  name: diun
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: diun-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diun
rules:
  # [수정] Pod 권한
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  # [수정] Deployment, StatefulSet 등을 읽기 위한 apps 권한 추가
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: diun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: diun
subjects:
  - kind: ServiceAccount
    name: diun
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: monitoring
  name: diun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diun
  template:
    metadata:
      labels:
        app: diun
      annotations:
        diun.enable: "true"
    spec:
      serviceAccountName: diun
      containers:
        - name: diun
          image: crazymax/diun:latest
          imagePullPolicy: Always
          args: ["serve"]
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_JSON
              value: "false"
            - name: DIUN_WATCH_WORKERS
              value: "20"
            - name: DIUN_WATCH_SCHEDULE
              value: "0 */1 * * * *"
            - name: DIUN_WATCH_JITTER
              value: "30s"
            - name: DIUN_PROVIDERS_KUBERNETES_WATCHBYDEFAULT
              value: "false"
            - name: DIUN_NOTIF_DISCORD_WEBHOOKURL
              value: "https://discordapp.com/api/webhooks/1506342405966790747/O9OnSrVXm7iK3wn2wiJ0sBl-RpC64I8eRR9hAQcbA7c1C5058jaiHJ5B33USWY7YBLtF"
          volumeMounts:
            - mountPath: "/data"
              name: "data"
      restartPolicy: Always
      volumes:
        - name: "data"
          persistentVolumeClaim:
            claimName: diun-pvc