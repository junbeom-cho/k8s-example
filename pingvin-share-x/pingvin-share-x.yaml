# ==================================================
# PersistentVolumeClaim (Longhorn)
# 통합 설정/이미지 관리용 단일 PVC
# ==================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pingvin-share-pvc
  namespace: pingvin-share
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 500Gi

---
# ==================================================
# ClamAV (Service & Deployment)
# ==================================================
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: pingvin-share
spec:
  type: ClusterIP
  selector:
    app: clamav
  ports:
    - name: tcp-clamav
      port: 3310
      targetPort: 3310

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: pingvin-share
  annotations:
    diun.enable: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3310
          livenessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 10
            periodSeconds: 10
---
# ==================================================
# Pingvin Share X Service (ClusterIP)
# ==================================================
apiVersion: v1
kind: Service
metadata:
  name: pingvin-share-x
  namespace: pingvin-share
spec:
  type: ClusterIP
  selector:
    app: pingvin-share-x
  ports:
    - name: frontend
      port: 3000
      targetPort: 3000
    - name: backend
      port: 8080
      targetPort: 8080

---
# ==================================================
# Pingvin Share X Deployment
# ==================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingvin-share-x
  namespace: pingvin-share
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingvin-share-x
  template:
    metadata:
      labels:
        app: pingvin-share-x
    spec:
      containers:
        - name: pingvin-share-x
          image: smp46/pingvin-share-x:latest
          imagePullPolicy: Always
          env:
            - name: TRUST_PROXY
              value: "true"
            - name: CLAMAV_HOST
              value: "clamav"
          ports:
            - containerPort: 3000
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pingvin-share-pvc
              mountPath: /data
              readOnly: false
      volumes:
        - name: pingvin-share-pvc
          persistentVolumeClaim:
            claimName: pingvin-share-pvc

---
# ==================================================
# Ingress (k3s Traefik 기반)
# ==================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingvin-share-x-ingress
  namespace: pingvin-share
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-crowdsec-bouncer@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: share.techbara.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pingvin-share-x
                port:
                  name: backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pingvin-share-x
                port:
                  name: frontend
  tls:
    - hosts:
        - share.techbara.dev
      secretName: pingvin-share-x-tls