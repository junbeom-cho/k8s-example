# =====================================================================
# MinIO — Helm values (Bitnami MinIO 차트)
# Chart     : bitnami/minio (https://charts.bitnami.com/bitnami)
# Repo      : helm repo add bitnami https://charts.bitnami.com/bitnami
# Version   : chart 17.0.21 / app 2025.7.23 (마지막 사용 기준; app 은 차트 appVersion — 실제 이미지는 bitnamilegacy/* :latest 태그)
# Namespace : minio
# Install   : helm upgrade --install minio bitnami/minio -n minio --create-namespace -f values.yaml
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================

architecture: standalone

fullnameOverride: "minio"

image:
  registry: docker.io
  repository: bitnamilegacy/minio
  tag: latest
  pullPolicy: IfNotPresent

clientImage:
  registry: docker.io
  repository: bitnamilegacy/minio-client
  tag: latest
  pullPolicy: IfNotPresent

console:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/minio-object-browser
    tag: latest
    pullPolicy: IfNotPresent
  
  ingress:
    enabled: true
    ingressClassName: "traefik"
    hostname: "minio.techbara.dev"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd, traefik-crowdsec-bouncer@kubernetescrd"
    tls: true

auth:
  existingSecret: "minio-secret"
  rootUserSecretKey: "ROOT_USER"
  rootPasswordSecretKey: "ROOT_PASSWORD"
  usePasswordFiles: true

extraEnvVars:
  - name: TZ
    value: "Asia/Seoul"

ingress:
  enabled: true
  ingressClassName: "traefik"
  hostname: "s3.techbara.dev"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-crowdsec-bouncer@kubernetescrd"
  tls: true


persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  storageClass: "longhorn"
