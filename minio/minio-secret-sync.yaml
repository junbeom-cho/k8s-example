apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: minio-secret-sync
  namespace: minio
spec:
  hostAPI: https://infisical.techbara.dev/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "minio"
        envSlug: "prod"
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-auth-token
        secretNamespace: infisical
  managedKubeSecretReferences:
    - secretName: minio-secret
      secretNamespace: minio
      secretType: Opaque
    - secretName: minio-secret
      secretNamespace: wordpress
      secretType: Opaque
    - secretName: minio-secret
      secretNamespace: karakeep
      secretType: Opaque