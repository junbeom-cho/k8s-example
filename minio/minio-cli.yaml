# =====================================================================
# MinIO Client (mc) — Kubernetes manifest (직접 작성, 관리용 mc 파드)
# Images    : docker.io/bitnamilegacy/minio-client:latest
# Namespace : minio
# Apply     : kubectl apply -f minio-cli.yaml
# 주의      : minio ns 는 Helm 릴리스(MinIO 본체 · 데이터 PVC)와 공유됩니다. kubectl delete -f 는 Namespace 까지 지우므로
#             제거는 kubectl delete deploy minio-cli -n minio 로 하세요.
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 이미지 태그/API 버전과
#    설정 변경 여부를 반드시 확인하세요.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-cli
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-cli
  template:
    metadata:
      labels:
        app: minio-cli
    spec:
      containers:
      - name: mc
        image: docker.io/bitnamilegacy/minio-client:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            mc alias set myminio http://minio.minio.svc.cluster.local:9000 "$ROOT_USER" "$ROOT_PASSWORD";
            sleep infinity
        env:
        - name: ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: ROOT_USER
        - name: ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: ROOT_PASSWORD
