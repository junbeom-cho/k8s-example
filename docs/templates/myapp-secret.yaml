# ==================================================
# Secret 템플릿 (placeholder 전용)
#
# ⚠️ 실제 값 금지. 이 파일은 "이 서비스가 어떤 키를 필요로 하는지" 문서 역할이며,
#    런타임 값은 myapp-secret-sync.yaml (InfisicalSecret) 이 Infisical 에서 채운다.
#    pre-commit 의 gitleaks 가 실제 크레덴셜 커밋을 차단한다.
#
# ⚠️ apply 순서 주의: secret-sync 가 이미 돌고 있는데 이 파일을 apply 하면
#    Secret 값이 placeholder 로 덮어써진다 (다음 resync, 최대 60초 뒤 복구).
#    최초 부트스트랩 때만 apply 하거나, 아예 apply 하지 않아도 된다
#    (InfisicalSecret 이 Secret 을 직접 생성한다).
#
# 키 이름은 Infisical 프로젝트(prod 환경)의 키 이름과 정확히 일치해야 한다.
# ==================================================
apiVersion: v1
kind: Secret
metadata:
  name: myapp-secret
  namespace: myapp
  labels:
    app: myapp
type: Opaque
stringData:
  # TODO: compose 의 environment 중 비밀 값들을 키로 나열
  DB_HOST: "your-db-host"
  DB_PORT: "5432"
  DB_NAME: "your-db-name"
  DB_USER: "your-db-user"
  DB_PASSWORD: "your-db-password"
  APP_SECRET_KEY: "your-secret-key"
