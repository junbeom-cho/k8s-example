# =====================================================================
# Longhorn — Helm values
# Chart     : longhorn/longhorn (https://charts.longhorn.io)
# Repo      : helm repo add longhorn https://charts.longhorn.io
# Version   : chart 1.12.0 / app v1.12.0 (마지막 사용 기준)
# Namespace : longhorn-system
# Install   : helm upgrade --install longhorn longhorn/longhorn -n longhorn-system --create-namespace -f values.yaml
# ⚠️ 마지막 사용 시점 기준 설정입니다. 다음에 사용할 때는 차트/앱 최신 버전과
#    values 키 변경(Breaking Changes) 여부를 반드시 확인하세요.
# =====================================================================

global:
  timezone: "Asia/Seoul"


persistence:
  defaultClassReplicaCount: 1
  reclaimPolicy: Retain 

csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

defaultSettings:
  defaultReplicaCount: "1"
  replicaReplenishmentWaitInterval: 0
  defaultDataPath: "/data/longhorn"
  storageReservedPercentageForDefaultDisk: 5

longhornUI:
  replicas: 1

ingress:
  enabled: true
  ingressClassName: "traefik" 
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-cloudflare-only@kubernetescrd, traefik-crowdsec-bouncer@kubernetescrd"
  host: "longhorn.techbara.dev"
  path: /
  pathType: Prefix
  tls: true
  tlsSecret: "longhorn-tls"
  
