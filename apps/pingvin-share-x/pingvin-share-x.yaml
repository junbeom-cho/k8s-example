# ==================================================
# PersistentVolumeClaim (Longhorn)
# 통합 설정/이미지 관리용 단일 PVC
# ==================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pingvin-share-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 500Gi

---
# ==================================================
# ClamAV (Service & Deployment)
# ==================================================
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: clamav
  ports:
    - name: tcp-clamav
      port: 3310
      targetPort: 3310

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: apps
  annotations:
    diun.enable: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3310
          livenessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 10
            periodSeconds: 10

---
# ==================================================
# Pingvin Share X Service (ClusterIP)
# ==================================================
apiVersion: v1
kind: Service
metadata:
  name: pingvin-share-x
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: pingvin-share-x
  ports:
    - name: frontend
      port: 3000
      targetPort: 3000
    - name: backend
      port: 8080
      targetPort: 8080

---
# ==================================================
# Pingvin Share X Deployment
# ==================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingvin-share-x
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingvin-share-x
  template:
    metadata:
      labels:
        app: pingvin-share-x
    spec:
      containers:
        - name: pingvin-share-x
          image: smp46/pingvin-share-x:latest
          imagePullPolicy: Always
          env:
            - name: TRUST_PROXY
              value: "true"
            - name: CLAMAV_HOST
              value: "clamav"
          ports:
            - containerPort: 3000
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pingvin-pvc
              mountPath: /opt/app/backend/data
              subPath: backend-data
            
            - name: backend-uploads
              mountPath: /opt/app/backend/data/uploads
            
            - name: pingvin-pvc
              mountPath: /opt/app/frontend/public/img
              subPath: frontend-images
      volumes:
        - name: pingvin-pvc
          persistentVolumeClaim:
            claimName: pingvin-share-pvc
        - name: backend-uploads
          hostPath:
            path: /var/local/k3s-hostpath/pingvin-share-x/uploads
            type: DirectoryOrCreate

---
# ==================================================
# Ingress (k3s Traefik 기반)
# ==================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingvin-share-x-ingress
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
    - host: pingvin.junbeom.work
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pingvin-share-x
                port:
                  name: backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pingvin-share-x
                port:
                  name: frontend
  tls:
    - hosts:
        - pingvin.junbeom.work
      secretName: pingvin-share-x-tls