# ==================================================================================
# 1. ConfigMap : 일반 환경 변수
# ==================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: shlink-config
  namespace: apps
data:
  TZ: "Asia/Seoul"
  MULTI_SEGMENT_SLUGS_ENABLED: "true"
  DEFAULT_DOMAIN: "link.junbeom.work"     # 기본 도메인 설정
  IS_HTTPS_ENABLED: "true"
  DB_DRIVER: "postgres"
  DB_HOST: "postgres-svc.core-infra.svc.cluster.local"  # PostgreSQL 서비스 주소
  REDIS_SERVERS: "tcp://shlink-redis-svc:6379"
  SHELL_VERBOSITY: "3"

---
# ==================================================================================
# 2. Redis PVC & Service & Deployment
# ==================================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shlink-redis-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: shlink-redis-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: shlink-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-redis
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shlink-redis
  template:
    metadata:
      labels:
        app: shlink-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "0.5"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: shlink-redis-pvc

---
# ==================================================================================
# 3. Backend Service & Deployment (단축 API / 실제 리다이렉트 처리)
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: shlink-backend-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: shlink-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-backend
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shlink-backend
  template:
    metadata:
      labels:
        app: shlink-backend
    spec:
      containers:
        - name: backend
          image: shlinkio/shlink:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shlink-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shlink-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shlink-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: shlink-secret
                  key: DB_NAME
            - name: GEOLITE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: shlink-secret
                  key: GEOLITE_LICENSE_KEY
          livenessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "500Mi"
            limits:
              cpu: "1.0"
              memory: "1.5Gi"

---
# ==================================================================================
# 4. Web UI Service & Deployment (관리자 대시보드)
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: shlink-web-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: shlink-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-web
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shlink-web
  template:
    metadata:
      labels:
        app: shlink-web
    spec:
      containers:
        - name: web
          image: shlinkio/shlink-web-client:latest
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: SHLINK_SERVER_URL
              value: "https://link.junbeom.work" # Backend 주소
            - name: SHLINK_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shlink-secret
                  key: SHLINK_SERVER_API_KEY
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 60
          resources:
            requests:
              cpu: "50m"
              memory: "20Mi"
            limits:
              cpu: "0.5"
              memory: "256Mi"

---
# ==================================================================================
# 6-1. Ingress : Backend (API / 단축 URL) - 외부 전체 공개
# ==================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink-backend-ingress
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - link.junbeom.work
      secretName: shlink-backend-tls-secret
  rules:
    - host: link.junbeom.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-backend-svc
                port:
                  number: 8080

---
# ==================================================================================
# 6-2. Ingress : Web UI (관리자 대시보드) - 내부망 전용
# ==================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink-web-ingress
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-internal-only@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - shlink.junbeom.work
      secretName: shlink-web-tls-secret
  rules:
    - host: shlink.junbeom.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-web-svc
                port:
                  number: 8080