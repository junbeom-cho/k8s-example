---
# ==================================================
# PVC: 데이터 영구 저장소
# ==================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-pvc
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ==================================================
# Deployment: 애플리케이션 워크로드
# ==================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app: mealie
  annotations:
    diun.enable: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Seoul"
            - name: BASE_URL
              value: "https://mealie.junbeom.work"
            - name: DB_ENGINE
              value: "postgres"
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: postgres-host
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: postgres-db
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: postgres-port
            - name: SMTP_HOST
              value: "smtp.resend.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM_NAME
              value: "Junbeom's Mealie"
            - name: SMTP_FROM_EMAIL
              value: "mealie@junbeom.work"
            - name: SMTP_USER
              value: "resend"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-secret
                  key: smtp-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1.0"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data/
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-pvc

---
# ==================================================
# Service: 내부 네트워크 노출
# ==================================================
apiVersion: v1
kind: Service
metadata:
  name: mealie-svc
spec:
  type: ClusterIP
  selector:
    app: mealie
  ports:
    - port: 9000
      targetPort: 9000
      name: http

---
# ==================================================
# Ingress: 외부 트래픽 라우팅
# ==================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-cloudflare-only@kubernetescrd"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - mealie.junbeom.work
      secretName: mealie-tls-secret
  rules:
    - host: mealie.junbeom.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie-svc
                port:
                  number: 9000