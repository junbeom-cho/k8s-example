# =================================================================================
# 1. ConfigMap : 환경 변수 분리
# =================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: syncthing-config
  namespace: apps
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "Asia/Seoul"

---
# =================================================================================
# 2. PersistentVolumeClaim : Syncthing 설정 데이터 저장소 (/config)
# =================================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
# ==================================================================================
# 3. Service (GUI) : 웹 관리자 페이지용 내부 네트워크
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: syncthing-gui-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: syncthing
  ports:
    - name: web-gui
      port: 80
      targetPort: 8384

---
# ==================================================================================
# 4. Service (Sync) : 실제 기기 간 동기화 통신용 네트워크 (LoadBalancer)
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: syncthing-sync-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: syncthing
  ports:
    - name: sync-tcp
      protocol: TCP
      port: 22000
      targetPort: 22000
    - name: sync-udp
      protocol: UDP
      port: 22000 
      targetPort: 22000
    - name: discovery-udp
      protocol: UDP
      port: 21027 
      targetPort: 21027

---
# ====================================================================================
# 5. Deployment : Syncthing 애플리케이션 실행
# ====================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: apps
  labels:
    app: syncthing
    category: file-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      containers:
        - name: syncthing
          image: lscr.io/linuxserver/syncthing:2.0.15
          
          envFrom:
            - configMapRef:
                name: syncthing-config
                
          ports:
            - containerPort: 8384
              name: web-gui
            - containerPort: 22000
              name: sync-tcp
              protocol: TCP
            - containerPort: 22000
              name: sync-udp
              protocol: UDP
            - containerPort: 21027
              name: discovery-udp
              protocol: UDP

          # ==========================================
          # 헬스체크 (httpGet 방식으로 리소스 최적화)
          # ==========================================
          livenessProbe:
            httpGet:
              path: /rest/noauth/health
              port: 8384
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /rest/noauth/health
              port: 8384
            initialDelaySeconds: 15
            periodSeconds: 15

          # ==========================================
          # 리소스 제한 (기존 Docker 설정 100% 반영)
          # ==========================================
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1.0"
              memory: "1Gi"

          # ==========================================
          # 볼륨 마운트
          # ==========================================
          volumeMounts:
            - name: syncthing-config-data
              mountPath: /config
            - name: obsidian-vault-data
              mountPath: /obsidian-vault

      volumes:
        - name: syncthing-config-data
          persistentVolumeClaim:
            claimName: syncthing-pvc
        - name: obsidian-vault-data
          hostPath:
            path: /home/junbeom/obsidian-vault
            type: DirectoryOrCreate

---
# ==================================================================================
# 6. Ingress : Traefik 대문 설정 + cert-manager (Cloudflare SSL 자동화)
# ==================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncthing-ingress
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sync.junbeom.work 
      secretName: syncthing-tls-secret
  rules:
    - host: sync.junbeom.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syncthing-gui-svc
                port:
                  number: 80
