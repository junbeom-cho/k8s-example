# ==================================================
# Secret: 데이터베이스 보안 정보
# ==================================================
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: apps
type: Opaque
stringData:
  postgres-user: "your_postgres_user"
  postgres-password: "your_postgres_password"
  postgres-database: "your_postgres_db"
  postgres-port: "your_postgres_port"
  postgres-host: "your_postgres_host" 
  smtp-host: "your_smtp_host"
  smtp-port: "your_smtp_port"
  smtp-user: "your_smtp_user"
  smtp-password: "your_smtp_password"
  smtp-sender: "your_smtp_sender"