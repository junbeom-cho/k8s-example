# ==============================================================================
# Syncthing Helm Chart Values
# https://artifacthub.io/packages/helm/k8s-home-lab-repo/syncthing
# ==============================================================================
podAnnotations:
  diun.enable: "true"

annotations:
  diun.enable: "true"

image:
  repository: lscr.io/linuxserver/syncthing
  tag: "2.1.0"
  pullPolicy: IfNotPresent

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Asia/Seoul"

service:
  main:
    type: ClusterIP
    ports:
      http:
        port: 8384
  
  listen:
    enabled: true
    type: LoadBalancer
    ports:
      listen: 
        enabled: true
        port: 22000
        protocol: TCP
        targetPort: 22000
      listen-udp:
        enabled: true
        port: 22000
        protocol: UDP
        targetPort: 22000
        
  discovery:
    enabled: true
    type: LoadBalancer
    ports:
      discovery:
        enabled: true
        port: 21027
        protocol: UDP
        targetPort: 21027

ingress:
  main:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
      traefik.ingress.kubernetes.io/router.middlewares: "core-infra-cloudflare-only@kubernetescrd"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: sync.junbeom.work
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: syncthing-tls-secret
        hosts:
          - sync.junbeom.work

persistence:
  config:
    enabled: true
    storageClass: "longhorn"
    accessMode: ReadWriteOnce
    size: 2Gi
    mountPath: /config

  obsidian-vault:
    enabled: true
    type: hostPath
    hostPath: /home/junbeom/obsidian-vault
    mountPath: /obsidian-vault

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "1.0"
    memory: "1Gi"

probes:
  liveness:
    custom: true
    spec:
      httpGet:
        path: /rest/noauth/health
        port: 8384
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 10
      failureThreshold: 3
  readiness:
    custom: true
    spec:
      httpGet:
        path: /rest/noauth/health
        port: 8384
      initialDelaySeconds: 15
      periodSeconds: 15