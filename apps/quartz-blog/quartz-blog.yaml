# =================================================================================
# 1. Deployment : Nginx 앱 실행 (볼륨, 리소스, 헬스체크 포함)
# =================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quartz-blog
  namespace: apps
  labels:
    app: quartz-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quartz-blog
  template:
    metadata:
      labels:
        app: quartz-blog
    spec:
      containers:
        - name: quartz-blog
          image: nginx:alpine
          ports:
            - containerPort: 80
          
          volumeMounts:
            - name: blog-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              readOnly: true
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
 
      volumes:
        - name: blog-content
          hostPath:   # 호스트의 볼륨을 컨테이너에 마운트
            path: /home/junbeom/quartz-blog
            type: DirectoryOrCreate
        - name: nginx-conf
          hostPath:   # 호스트의 볼륨을 컨테이너에 마운트
            path: /home/junbeom/quartz-blog/default.conf
            type: File
 
---
# ==================================================================================
# 2. Service : 클러스터 내부 네트워크 연결 (ClusterIP)
# ==================================================================================
apiVersion: v1
kind: Service
metadata:
  name: quartz-blog-svc
  namespace: apps
spec:
  type: ClusterIP       # 클러스터 내부에서만 접근 가능한 서비스
  selector:
    app: quartz-blog
  ports:
    - port: 80
      targetPort: 80
 
---
# ==================================================================================
# 3. Ingress : Traefik 대문 설정 (외부 도메인 연결)
# ==================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quartz-blog-ingress
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik             # SSL 자동화를 위해 Traefik IngressClass 지정
  rules:
    - host: obsidian.junbeom.work       # 사용할 도메인
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quartz-blog-svc
                port:
                  number: 80